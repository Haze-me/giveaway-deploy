# Sealed Secrets: lets us keep secrets in git safely. You encrypt a secret on your PC with the
# cluster's PUBLIC certificate; only this controller (which holds the private key) can decrypt it.
#
# `fullnameOverride` keeps the controller named "sealed-secrets-controller" in kube-system, which
# is where the kubeseal tool looks for it by default.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 24h
  url: https://bitnami-labs.github.io/sealed-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: sealed-secrets
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: sealed-secrets-controller
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
