# The few values that differ per deployment. Edit these once, commit, and Flux applies them.
# They are NOT secret (hostnames and email addresses), so they live in git in plain text.
#
# Anything still containing CHANGE_ME will break TLS or CORS. Run ./scripts/check-placeholders.sh
# before you push.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # Where guests and hosts open the app (frontend + /api + /admin on one hostname).
  APP_HOST: "app.emchrismobility.com"
  # Where the landing page's backend (reviews + feedback) answers. The landing page itself
  # stays on Vercel and calls this address.
  LANDING_API_HOST: "emchrismobility.com"
  # Origins allowed to call the landing backend (browser CORS): your landing page's address(es),
  # comma separated, no trailing slash. Example: https://www.example.com,https://my-site.vercel.app
  LANDING_ORIGINS: "https://www.emchrismobility.com,https://emchrismobility.com,https://app.emchrismobility.com"
  # Let's Encrypt sends certificate expiry warnings here.
  ACME_EMAIL: "harrisonaka29@gmail.com"
  # The "from" address on emails the app sends (the domain must be verified in Resend).
  FROM_EMAIL: "no-reply@emchrismobility.com"
  # Where the app emails you about payouts, refunds and disputes that need a person.
  ALERT_EMAIL: "harrisonaka29@gmail.com"
