apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: landing

resources:
  - namespace.yaml
  - backend.yaml
  - ingress.yaml
  # Created by ./scripts/seal-all.sh (encrypted, safe to commit).
  - secrets/landing-secrets.sealed.yaml

configMapGenerator:
  - name: landing-config
    envs:
      - config.env

# CI (in the landing page repo) rewrites ONLY this newTag line to the git commit of each build.
images:
  - name: haze21/haze-landing-backend
    newTag: latest
