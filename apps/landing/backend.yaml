# The landing page's Django API (gunicorn, port 8000): public reviews and the feedback form.
# Its database ("landing") lives in the same Postgres as the giveaway app, but with its own login.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-backend
  namespace: landing
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: landing-backend
  template:
    metadata:
      labels:
        app: landing-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: haze21/haze-landing-backend
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: landing-config
            - secretRef:
                name: landing-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
      containers:
        - name: landing-backend
          image: haze21/haze-landing-backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: landing-config
            - secretRef:
                name: landing-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: landing-backend
  namespace: landing
spec:
  selector:
    app: landing-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
