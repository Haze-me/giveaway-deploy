# The landing page's API answers on its own hostname (${LANDING_API_HOST}); every path goes to it.
# Same staging-first certificate as apps/giveaway/ingress.yaml. the NGINX Ingress Controller
# redirects HTTP to HTTPS by itself for an Ingress with a `tls:` block, and needs http01-edit-in-place.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-backend
  namespace: landing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${LANDING_API_HOST}
      secretName: landing-api-tls
  rules:
    - host: ${LANDING_API_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-backend
                port:
                  number: 8000
